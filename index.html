<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Prono Foot Pro - IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .match-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .match-card:hover { transform: translateY(-8px); border-color: #22c55e; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 italic uppercase tracking-tighter mb-2">PRONO FOOT PRO</h1>
            <div class="inline-block bg-green-500/10 border border-green-500/20 px-4 py-1 rounded-full text-green-400 text-[10px] font-bold tracking-widest uppercase text-center">Analyse par Intelligence Artificielle</div>
        </header>

        <!-- Navigation -->
        <div class="flex justify-center space-x-4 mb-12">
            <button id="btn-matchs" class="px-8 py-3 bg-green-600 rounded-2xl font-black text-white shadow-xl shadow-green-900/40 transition-all scale-105">MATCHS</button>
            <button id="btn-resultats" class="px-8 py-3 bg-gray-800 rounded-2xl font-black text-gray-400 hover:text-white transition-all">RÉSULTATS</button>
        </div>

        <!-- Grille Principale -->
        <div id="display-grid" class="grid gap-8 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full text-center py-20 animate-pulse text-gray-500 italic uppercase tracking-widest">Synchronisation des serveurs IA...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        
        const SUPABASE_URL = 'https://cmufapilshppnqulbdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtdWZhcGlsc2hwcG5xdWxiZHJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDA4NzAsImV4cCI6MjEwMTAxNjg3MH0.UI0GKMfQgIGby_Tu_Q5Q4hOCpASxRe63pHLVr5lPOV0';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const grid = document.getElementById('display-grid');
        const btnMatchs = document.getElementById('btn-matchs');
        const btnResultats = document.getElementById('btn-resultats');

        // Aide à l'affichage des pastilles de forme
        function getFormBadges(formStr) {
            if (!formStr) return '<span class="text-[9px] text-gray-600 italic uppercase">Aucune Stat</span>';
            return formStr.split('').map(res => {
                let color = 'bg-gray-600';
                if (res === 'V') color = 'bg-green-500';
                if (res === 'D') color = 'bg-red-500';
                if (res === 'N') color = 'bg-blue-500';
                return `<span class="w-2.5 h-2.5 ${color} rounded-full inline-block mx-0.5 border border-black/20 shadow-sm"></span>`;
            }).join('');
        }

        // Action interactive au clic
        window.parier = (equipe, cote) => {
            alert(`🎯 ANALYSE IA : Votre choix (${equipe}) avec une cote de ${cote} présente une probabilité de succès élevée selon nos calculs basés sur les 5 derniers matchs.`);
        };

        // CHARGER LES MATCHS (VUE PAR DÉFAUT)
        async function loadMatchs() {
            btnMatchs.className = 'px-8 py-3 bg-green-600 rounded-2xl font-black text-white shadow-xl shadow-green-900/40 transition-all scale-105';
            btnResultats.className = 'px-8 py-3 bg-gray-800 rounded-2xl font-black text-gray-400 hover:text-white transition-all';
            grid.innerHTML = '<div class="col-span-full text-center py-20 italic">Calcul des probabilités en cours...</div>';

            const { data: matches, error } = await supabase
                .from('matches')
                .select('*, home:team_home_id(name, logo, form, attack, defense), away:team_away_id(name, logo, form, attack, defense)')
                .is('SCORE_HOME', null);

            if (!matches || matches.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 border border-dashed border-gray-700 rounded-3xl uppercase tracking-tighter">Aucun match disponible à l\'analyse</div>';
                return;
            }

            grid.innerHTML = matches.map(m => {
                const conf = m.confidence || 85;
                return `
                <div class="match-card bg-gray-800 border border-gray-700 rounded-[2.5rem] p-7 shadow-2xl flex flex-col relative overflow-hidden">
                    
                    <!-- SECTION FIABILITÉ IA -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-1.5 px-1">
                            <span class="text-[10px] font-black text-green-400 tracking-widest uppercase italic">Fiabilité IA</span>
                            <span class="text-xs font-black text-white">${conf}%</span>
                        </div>
                        <div class="w-full bg-gray-900 h-2.5 rounded-full p-0.5 border border-gray-700 shadow-inner">
                            <div class="bg-gradient-to-r from-green-600 to-green-400 h-full rounded-full glow-green" style="width: ${conf}%"></div>
                        </div>
                    </div>

                    <!-- ÉQUIPES -->
                    <div class="flex items-center justify-between mb-8 text-center">
                        <div class="flex-1 flex flex-col items-center">
                            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center p-2.5 mb-2 shadow-xl border-4 border-gray-900">
                                <img src="${m.home?.logo}" class="max-w-full max-h-full object-contain">
                            </div>
                            <span class="font-black text-[11px] uppercase tracking-tighter text-white">${m.home?.name || 'DOMICILE'}</span>
                            <div class="mt-1 flex items-center">${getFormBadges(m.home?.form)}</div>
                        </div>
                        <div class="px-2 font-black text-green-500 italic text-2xl drop-shadow-md">VS</div>
                        <div class="flex-1 flex flex-col items-center">
                            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center p-2.5 mb-2 shadow-xl border-4 border-gray-900">
                                <img src="${m.away?.logo}" class="max-w-full max-h-full object-contain">
                            </div>
                            <span class="font-black text-[11px] uppercase tracking-tighter text-white">${m.away?.name || 'EXTÉRIEUR'}</span>
                            <div class="mt-1 flex items-center">${getFormBadges(m.away?.form)}</div>
                        </div>
                    </div>

                    <!-- BOUTONS COTES -->
                    <div class="flex gap-3 mt-auto">
                        <button onclick="parier('${m.home?.name}', '${m.odd_1 || '1.80'}')" class="flex-1 bg-gray-900 hover:bg-green-600 py-3 rounded-2xl transition-all border border-gray-700 flex flex-col items-center group">
                            <span class="text-[9px] text-gray-500 group-hover:text-white font-bold uppercase">1</span>
                            <span class="text-lg font-black text-green-400 group-hover:text-white">${m.odd_1 || '1.80'}</span>
                        </button>
                        <button onclick="parier('Match Nul', '${m.odd_n || '3.20'}')" class="flex-1 bg-gray-900 hover:bg-blue-600 py-3 rounded-2xl transition-all border border-gray-700 flex flex-col items-center group">
                            <span class="text-[9px] text-gray-500 group-hover:text-white font-bold uppercase">N</span>
                            <span class="text-lg font-black text-blue-400 group-hover:text-white">${m.odd_n || '3.20'}</span>
                        </button>
                        <button onclick="parier('${m.away?.name}', '${m.odd_2 || '4.50'}')" class="flex-1 bg-gray-900 hover:bg-red-600 py-3 rounded-2xl transition-all border border-gray-700 flex flex-col items-center group">
                            <span class="text-[9px] text-gray-500 group-hover:text-white font-bold uppercase">2</span>
                            <span class="text-lg font-black text-red-400 group-hover:text-white">${m.odd_2 || '4.50'}</span>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // CHARGER LES RÉSULTATS
        async function loadResultats() {
            btnResultats.className = 'px-8 py-3 bg-green-600 rounded-2xl font-black text-white shadow-xl shadow-green-900/40 transition-all scale-105';
            btnMatchs.className = 'px-8 py-3 bg-gray-800 rounded-2xl font-black text-gray-400 hover:text-white transition-all';
            grid.innerHTML = '<div class="col-span-full text-center py-20 italic uppercase tracking-widest text-gray-600">Ouverture du Panthéon...</div>';

            const { data: results, error } = await supabase
                .from('matches')
                .select('*, home:team_home_id(name, logo), away:team_away_id(name, logo)')
                .not('SCORE_HOME', 'is', null);

            if (!results || results.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500">Aucun match terminé enregistré.</div>';
                return;
            }

            grid.innerHTML = results.map(r => `
                <div class="bg-gray-800 border-2 border-green-500/20 rounded-[2.5rem] p-7 shadow-2xl relative overflow-hidden">
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-green-500 text-black text-[10px] font-black px-6 py-1.5 rounded-full uppercase tracking-widest shadow-lg">PRONO VALIDÉ ✅</div>
                    <div class="flex items-center justify-between mt-4">
                        <div class="flex flex-col items-center flex-1">
                            <img src="${r.home?.logo}" class="w-14 h-14 object-contain mb-2">
                            <span class="text-[10px] font-black uppercase text-gray-500">${r.home?.name}</span>
                        </div>
                        <div class="text-4xl font-black text-white px-6 italic tracking-tighter">${r.SCORE_HOME} - ${r.SCORE_AWAY}</div>
                        <div class="flex flex-col items-center flex-1">
                            <img src="${r.away?.logo}" class="w-14 h-14 object-contain mb-2">
                            <span class="text-[10px] font-black uppercase text-gray-500">${r.away?.name}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Configuration des boutons du menu
        btnMatchs.onclick = loadMatchs;
        btnResultats.onclick = loadResultats;

        // Démarrage automatique
        loadMatchs();
    </script>
</body>
</html>
