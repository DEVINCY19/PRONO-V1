<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Prono Foot Pro</title>
    <!-- Tailwind CSS pour un design pro instantané -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .match-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 mb-2">
                PRONO FOOT PRO
            </h1>
            <p class="text-gray-400">Vos prochains matchs et analyses</p>
        </header>

        <!-- Grille où les matchs vont s'afficher -->
        <div id="matches-grid" class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-green-500 mb-4"></div>
                <p class="text-gray-500">Chargement des données Supabase...</p>
            </div>
        </div>
    </div>

    <!-- Script Supabase & Logique -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // Configuration
        const SUPABASE_URL = 'https://cmufapilshppnqulbdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtdWZhcGlsc2hwcG5xdWxiZHJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDA4NzAsImV4cCI6MjEwMTAxNjg3MH0.UI0GKMfQgIGby_Tu_Q5Q4hOCpASxRe63pHLVr5lPOV0';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const grid = document.getElementById('matches-grid');

            try {
                // Récupération des matchs avec les noms et logos des équipes
                const { data: matches, error } = await supabase
                    .from('matches')
                    .select(`
                        *,
                        home:team_home_id(name, logo),
                        away:team_away_id(name, logo)
                    `);

                if (error) throw error;

                if (!matches || matches.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500">Aucun match disponible.</p>';
                    return;
                }

                // Génération du HTML
                grid.innerHTML = matches.map(match => {
                    // Utilisation du proxy weserv.nl pour forcer l'affichage des logos Wikipédia
                    const homeLogo = `https://images.weserv.nl/?url=${match.home?.logo}&w=100`;
                    const awayLogo = `https://images.weserv.nl/?url=${match.away?.logo}&w=100`;
                    const date = new Date(match.match_date).toLocaleDateString('fr-FR', { 
                        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' 
                    });

                    return `
                        <div class="match-card bg-gray-800 border border-gray-700 rounded-2xl p-6 flex flex-col justify-between">
                            <div class="flex items-center justify-between gap-4 mb-6">
                                <!-- Home Team -->
                                <div class="flex flex-col items-center flex-1">
                                    <div class="w-16 h-16 bg-gray-900 rounded-full flex items-center justify-center p-2 mb-2 shadow-inner">
                                        <img src="${homeLogo}" alt="${match.home?.name}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/100?text=?'">
                                    </div>
                                    <span class="font-bold text-sm text-center">${match.home?.name || 'Inconnu'}</span>
                                </div>

                                <div class="flex flex-col items-center">
                                    <span class="text-xl font-black text-gray-600 italic">VS</span>
                                    <span class="text-[10px] bg-gray-700 px-2 py-0.5 rounded mt-2 text-gray-400 uppercase font-bold tracking-tighter">${match.league}</span>
                                </div>

                                <!-- Away Team -->
                                <div class="flex flex-col items-center flex-1">
                                    <div class="w-16 h-16 bg-gray-900 rounded-full flex items-center justify-center p-2 mb-2 shadow-inner">
                                        <img src="${awayLogo}" alt="${match.away?.name}" class="max-w-full max-h-full object-contain" onerror="this.src='https://placehold.co/100?text=?'">
                                    </div>
                                    <span class="font-bold text-sm text-center">${match.away?.name || 'Inconnu'}</span>
                                </div>
                            </div>

                            <div class="mt-4 pt-4 border-t border-gray-700 text-center text-xs text-gray-500 font-medium">
                                📅 ${date}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500">Erreur lors du chargement : ${err.message}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
