<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Prono Foot Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 mb-2 italic">PRONO FOOT PRO</h1>
        </header>

        <!-- NOUVEAU : Menu de Navigation -->
        <div class="flex justify-center space-x-4 mb-8">
            <button id="btn-matchs" class="px-6 py-2 bg-green-600 rounded-full font-bold text-white shadow-lg">Matchs</button>
            <button id="btn-resultats" class="px-6 py-2 bg-gray-800 rounded-full font-bold text-gray-400 hover:bg-gray-700 transition">Résultats</button>
        </div>

        <!-- La Grille (utilisée pour les deux vues) -->
        <div id="display-grid" class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            <!-- Le contenu sera injecté ici par JavaScript -->
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient('VOTRE_URL', 'VOTRE_CLE');

        const grid = document.getElementById('display-grid');
        const btnMatchs = document.getElementById('btn-matchs');
        const btnResultats = document.getElementById('btn-resultats');

        // FONCTION 1 : AFFICHER LES MATCHS À VENIR (AVEC 1-N-2)
        async function loadMatchs() {
            btnMatchs.className = 'px-6 py-2 bg-green-600 rounded-full font-bold text-white shadow-lg';
            btnResultats.className = 'px-6 py-2 bg-gray-800 rounded-full font-bold text-gray-400';
            
            const { data: matches } = await supabase
                .from('matches')
                .select('*, home:team_home_id(name, logo), away:team_away_id(name, logo)')
                .is('score_home', null); // On prend ceux qui n'ont pas encore de score

            grid.innerHTML = matches.map(m => `
                <div class="bg-gray-800 border border-gray-700 rounded-3xl p-6 shadow-2xl">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex flex-col items-center flex-1">
                            <img src="${m.home?.logo}" class="w-16 h-16 object-contain mb-2">
                            <span class="font-bold text-xs text-center">${m.home?.name}</span>
                        </div>
                        <div class="px-2 font-black text-gray-600 italic">VS</div>
                        <div class="flex flex-col items-center flex-1">
                            <img src="${m.away?.logo}" class="w-16 h-16 object-contain mb-2">
                            <span class="font-bold text-xs text-center">${m.away?.name}</span>
                        </div>
                    </div>
                    <!-- Boutons 1-N-2 -->
                    <div class="flex gap-2 mt-4">
                        <button class="flex-1 bg-gray-700 hover:bg-green-600 py-2 rounded-xl font-bold text-white transition-colors">1</button>
                        <button class="flex-1 bg-gray-700 hover:bg-blue-600 py-2 rounded-xl font-bold text-white transition-colors">N</button>
                        <button class="flex-1 bg-gray-700 hover:bg-red-600 py-2 rounded-xl font-bold text-white transition-colors">2</button>
                    </div>
                </div>
            `).join('');
        }

        // FONCTION 2 : AFFICHER LES RÉSULTATS (AVEC SCORES)
        async function loadResultats() {
            btnResultats.className = 'px-6 py-2 bg-green-600 rounded-full font-bold text-white shadow-lg';
            btnMatchs.className = 'px-6 py-2 bg-gray-800 rounded-full font-bold text-gray-400';

            const { data: results } = await supabase
                .from('matches')
                .select('*, home:team_home_id(name, logo), away:team_away_id(name, logo)')
                .not('score_home', 'is', null); // On prend ceux qui ONT un score

            grid.innerHTML = results.map(r => `
                <div class="bg-gray-800 border-2 border-green-500/20 rounded-3xl p-6 shadow-2xl relative">
                    <div class="absolute top-3 right-3 bg-green-500 text-black text-[9px] font-black px-2 py-0.5 rounded uppercase">Terminé</div>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col items-center flex-1">
                            <img src="${r.home?.logo}" class="w-12 h-12 object-contain mb-1">
                            <span class="text-[10px] font-bold">${r.home?.name}</span>
                        </div>
                        <div class="text-3xl font-black text-white px-4">${r.score_home} - ${r.score_away}</div>
                        <div class="flex flex-col items-center flex-1">
                            <img src="${r.away?.logo}" class="w-12 h-12 object-contain mb-1">
                            <span class="text-[10px] font-bold">${r.away?.name}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Écouteurs d'événements pour le menu
        btnMatchs.onclick = loadMatchs;
        btnResultats.onclick = loadResultats;

        // Charger les matchs par défaut au démarrage
        loadMatchs();
    </script>
</body>
</html>
